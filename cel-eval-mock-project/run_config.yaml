# CEL A/B 实验配置
#
# 可执行任务的唯一来源是 task_suite.json。批次目录必须由
# `_runner.py batch` 创建，不能手工复用旧工作区。

schema_version: 2

task_selection:
  manifest: task_suite.json
  default_suite: primary

batch:
  # 实际值由调用者传入，例如 codex_gpt-5_20260724T120000Z。
  id: "{batch_id}"
  platform: "{platform}"
  model: "{model}"
  root: "../test-runs/{batch_id}"

  layout:
    control_workspace: "workspaces/{task_id}/control"
    cel_workspace: "workspaces/{task_id}/cel"
    control_result: "results/{task_id}/control"
    cel_result: "results/{task_id}/cel"

  invariants:
    refuse_existing_batch: true
    independent_workspace_copies: true
    identical_initial_task_payload: true
    result_outside_workspace: true
    validation_in_disposable_copy: true
    source_integrity_guard: true

worker:
  # 两组必须使用相同平台、模型、权限策略和最大轮次。
  same_agent_configuration: true
  max_turns:
    simple: 10
    medium: 20
    complex: 50

  # Control 只收到公共任务提示，不包含“不要使用 CEL”之类的负向干预。
  # CEL 在相同公共提示后仅增加技能启用指令。
  treatment_difference_only: true

observer:
  hook: PostToolUse
  same_for_control_and_cel: true
  hidden_from_model_context: true
  validation_workspace: disposable_copy
  output_only: true
  agent_self_report_is_numeric_source: false

commands:
  create_batch: "python _runner.py batch {batch_id} {platform} primary"
  verify_batch: "python _runner.py verify_batch ../test-runs/{batch_id}"
  codex_run: "python -m harness.codex_runner --config {config} --prompt-file {prompt}"
  codebuddy_run: "node harness/codebuddy_runner.mjs --config {config} --prompt-file {prompt}"

prompt_document:
  path: "../meta_plan/test-run-prompts.md"
  contains: ["整批运行提示词", "独立审计提示词"]

# CEL 执行与评测 skill 真源位于仓库 `_shared/skills/`。
# Worker 只使用执行 skill 的一次性安装副本；批次前后会校验两个真源摘要。
cel_runtime:
  source: "../_shared/skills/convergent-engineering-loop"
  install_copy_only_for_cel: true
  source_must_remain_unchanged: true
